---
# Required variables:
#   discord_webhooks  — a list of {url} objects (store in Ansible Vault)
#   discord_message   — the message string to send
#
# Optional variables:
#   discord_username  — display name shown in the notification (default: "Ansible")
#   discord_body      — override the entire POST body dict (default: {content, username})

- name: POST Discord webhook notification
  ansible.builtin.uri:
    url: "{{ discord_webhook.url }}"
    method: POST
    body_format: json
    body: "{{ discord_body | default({'content': discord_message, 'username': discord_username | default('Ansible')}) }}"
    status_code: [200, 204]
  no_log: true
  delegate_to: localhost
  loop: "{{ discord_webhooks | default([]) }}"
  loop_control:
    loop_var: discord_webhook
